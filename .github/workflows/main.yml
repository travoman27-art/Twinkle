name: Direct P4A APK Build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: kivy/buildozer:latest
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Fix permissions for workspace
        run: |
          git config --global --add safe.directory /github/workspace

      - name: Build APK directly with python-for-android
        run: |
          python3 -m pythonforandroid.toolchain apk \
            --private . \
            --package=org.twinklehub \
            --name="TwinkleHub" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --requirements=python3,kivy,jnius \
            --arch=arm64-v8a \
            --android-api 33 \
            --ndk-dir /home/user/android/android-ndk-r25b \
            --sdk-dir /home/user/android/android-sdk \
            --permissions INTERNET BIND_VPN_SERVICE \
            --add-source java \
            --verbosity=2

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twinklehub-direct-apk
          path: '*.apk'
          
